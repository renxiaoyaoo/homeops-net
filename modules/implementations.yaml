principles:
  - Implementation contracts are owned by modules, not by deployment instances.
  - Module-owned adapters are preferred; remaining centralized CLI implementations are adoption backlog.
  - Implementation entries must not contain rendered config values or secrets.
  - Review-only implementations may produce deterministic review output but must not imply live apply support.
